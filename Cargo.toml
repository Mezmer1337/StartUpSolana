[workspace]
members = ["programs/*"]
resolver = "2"

# crates/petdna (Rust CLI) and native/pet_passport (native program) are
# separate workspaces with their own Cargo.lock — see their Cargo.toml.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
