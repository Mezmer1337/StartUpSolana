[package]
name = "pet_counter"
version = "0.1.0"
description = "PetNFT care counter: an Anchor Counter Program (course week 5)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pet_counter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
